name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# The test suites are kept off GitHub (they live beside the working tree,
# not in it), so CI checks what needs no suite: that both clients parse and
# answer under every shell and PowerShell they claim, ShellCheck, staging,
# and the installers' install, reinstall and uninstall.
jobs:
  # The sh client under every shell it claims, and ShellCheck.
  shells:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shells and awks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dash mksh ksh zsh busybox posh mawk gawk original-awk
      - name: Parses and answers under each shell
        run: |
          set -e
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          for sh in dash "bash --posix" bash mksh ksh93 posh zsh "busybox sh"; do
            printf '%-12s ' "$sh"
            # ksh93's -n also lints, on success too: shown only on failure.
            out=$($sh -n breezectl 2>&1) || { printf '%s\n' "$out"; exit 1; }
            LANG=C.UTF-8 $sh breezectl help >/dev/null
            LANG=C.UTF-8 $sh breezectl --version
          done
      - name: ShellCheck
        run: |
          shellcheck -S warning -s sh breezectl install.sh stage.sh
          shellcheck -S warning -s bash completions/breezectl.bash
      - name: Stage, as aspic would
        run: sh stage.sh --dirty "$RUNNER_TEMP/dist" && cat "$RUNNER_TEMP/dist/SHA256SUMS"

  # install.sh for a bash user and for root: install, again (startup file
  # unchanged), then out.
  install-linux:
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - uses: actions/checkout@v4
      - name: Shells
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends zsh fish curl ca-certificates dash
      - name: install.sh
        run: |
          set -e
          sh stage.sh --dirty /dist
          export HOME=/tmp/home SHELL=/bin/bash
          mkdir -p "$HOME"; touch "$HOME/.bashrc"
          sh install.sh --from /dist --no-login </dev/null
          command -v breezectl || test -x /usr/local/bin/breezectl || test -x "$HOME/.local/bin/breezectl"
          cp "$HOME/.bashrc" /tmp/bashrc.after
          sh install.sh --from /dist --no-login </dev/null
          cmp "$HOME/.bashrc" /tmp/bashrc.after
          sh install.sh --uninstall </dev/null
          test ! -e /usr/local/bin/breezectl
          test ! -e "$HOME/.local/bin/breezectl"

  # macOS: /bin/sh is bash 3.2 in POSIX mode, the login shell is zsh, and
  # bash itself is 3.2.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parses and answers under /bin/sh, zsh and bash 3.2
        run: |
          set -e
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          for sh in /bin/sh /bin/zsh /bin/bash /bin/dash; do
            [ -x "$sh" ] || continue
            printf '%-10s ' "$sh"; "$sh" -n breezectl; LANG=en_US.UTF-8 "$sh" breezectl --version
          done
      - name: install.sh for a zsh user
        run: |
          set -e
          sh stage.sh --dirty "$RUNNER_TEMP/dist"
          export HOME="$RUNNER_TEMP/home" SHELL=/bin/zsh
          mkdir -p "$HOME"
          sh install.sh --from "$RUNNER_TEMP/dist" --no-login
          test "$(zsh -i -c 'command -v breezectl' | tail -n 1)" = "$HOME/.local/bin/breezectl"
          bash -c '. "$HOME/.local/share/bash-completion/completions/breezectl"; complete -p breezectl'
          cp "$HOME/.zshrc" "$RUNNER_TEMP/zshrc.after"
          sh install.sh --from "$RUNNER_TEMP/dist" --no-login
          cmp "$HOME/.zshrc" "$RUNNER_TEMP/zshrc.after"
          sh install.sh --uninstall
          test ! -e "$HOME/.local/bin/breezectl"
          ! grep -q breezectl "$HOME/.zshrc"

  # Both PowerShells on Windows: the scripts parse, and the client answers.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parses and answers in both PowerShells
        run: |
          $check = {
            foreach ($f in 'breezectl.ps1', 'install.ps1', 'completions/breezectl-completion.ps1') {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
              if ($errors) { $errors; exit 1 }
            }
            & ./breezectl.ps1 --version
            if ($LASTEXITCODE) { exit 1 }
          }
          pwsh -NoProfile -Command $check
          if ($LASTEXITCODE) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -Command $check
          if ($LASTEXITCODE) { exit 1 }
      - name: Stage
        shell: bash
        run: sh stage.sh --dirty "$RUNNER_TEMP/dist"

  # PowerShell 7 off Windows.
  pwsh-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -NoProfile -Command '& ./breezectl.ps1 --version; if ($LASTEXITCODE) { exit 1 }'
